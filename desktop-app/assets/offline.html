<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تعذر الاتصال بالخادم</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #090a0f 0%, #12151d 100%);
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(26, 29, 38, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 18px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    p {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .target-url {
      direction: ltr;
      display: inline-block;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: monospace;
      color: #d4af37;
      font-size: 13px;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      color: #0b0c10;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .auto-retry {
      margin-top: 20px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>تعذر الاتصال بالخادم</h1>
    <p>يرجى التأكد من اتصالك بالإنترنت أو التأكد من تشغيل السيرفر في حال كنت تعمل على بيئة التطوير المحلية.</p>
    <div class="target-url" id="urlDisplay">جاري التحقق...</div>
    <div class="btn-group">
      <button class="btn-primary" onclick="retry()">إعادة المحاولة الآن</button>
      <button class="btn-secondary" onclick="toggleLocal()">التحويل إلى المحلي (Localhost)</button>
    </div>
    <div class="auto-retry" id="timerDisplay">إعادة المحاولة التلقائية بعد 5 ثوانٍ...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url') || 'https://ygcarss.com/admin';
    document.getElementById('urlDisplay').innerText = targetUrl;

    let countdown = 5;
    const timerElem = document.getElementById('timerDisplay');

    const interval = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(interval);
        retry();
      } else {
        timerElem.innerText = `إعادة المحاولة التلقائية بعد ${countdown} ثوانٍ...`;
      }
    }, 1000);

    function retry() {
      window.location.href = targetUrl;
    }

    function toggleLocal() {
      if (window.electronAPI && window.electronAPI.toggleMode) {
        window.electronAPI.toggleMode();
      } else {
        window.location.href = 'http://localhost:3000/admin';
      }
    }
  </script>
</body>
</html>
